name: setup-nix

inputs:
  system:
    required: true
  large:
    default: 'false'
  attic-token:
    required: true

runs:
  using: composite
  steps:
    - name: "Create Directory for Nix Store"
      if: ${{ inputs.large != 'true' }}
      shell: bash
      run: |
        sudo mkdir /nix
    - name: "Maximize Disk Space"
      if: ${{ inputs.large == 'true' }}
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

    # We only run this if we are building an aarch64-linux system
    - if: inputs.system == 'aarch64-linux'
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
      with:
        extra_nix_config: |
          fallback = true
          http-connections = 128
          max-substitution-jobs = 128
          extra-platforms = i686-linux aarch64-linux
          substituters = https://nix-cache.diogotc.com/dtc?priority=43 https://cache.nixos.org/
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= dtc:HU5hQrzlNDSFAcA/kvzKx+IhyDYLvR+xUS/1drh3o2U=
          allow-import-from-derivation = false
          abort-on-warn = true

    # We make our netrc file that is used to make authorized requests to Attic
    - name: setup netrc
      shell: bash
      run: |
        echo "machine nix-cache.diogotc.com password ${{ inputs.attic-token }}" | sudo tee /etc/nix/netrc > /dev/null
